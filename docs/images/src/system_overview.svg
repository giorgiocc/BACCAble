<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="42" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" fill="#111827" text-anchor="start" font-weight="bold">The big picture — what the BACCAble is and why it has three boards</text>
<text x="30" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#64748b" text-anchor="start" font-weight="normal">The car has three separate CAN networks. One UCAN board sits on each; C1 is the boss and talks to the other two over one wire.</text>
<text x="170" y="112" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#111827" text-anchor="middle" font-weight="bold">YOUR CAR</text>
<rect x="30" y="130" width="280" height="160" rx="12" fill="#fff" stroke="#d97706" stroke-width="3"/>
<text x="170" y="162" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#d97706" text-anchor="middle" font-weight="bold">C1 network</text>
<text x="170" y="186" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">OBD 6 / 14 · 500 kbit/s</text>
<text x="170" y="222" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="normal">engine, gearbox,</text>
<text x="170" y="244" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="normal">steering-wheel buttons</text>
<rect x="30" y="320" width="280" height="160" rx="12" fill="#fff" stroke="#0891b2" stroke-width="3"/>
<text x="170" y="352" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#0891b2" text-anchor="middle" font-weight="bold">C2 network</text>
<text x="170" y="376" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">OBD 12 / 13 · 500 kbit/s</text>
<text x="170" y="412" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="normal">ESC / TC, ABS, brakes,</text>
<text x="170" y="434" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="normal">parking sensors</text>
<rect x="30" y="510" width="280" height="160" rx="12" fill="#fff" stroke="#16a34a" stroke-width="3"/>
<text x="170" y="542" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#16a34a" text-anchor="middle" font-weight="bold">BH network</text>
<text x="170" y="566" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">OBD 3 / 11 · 125 kbit/s</text>
<text x="170" y="602" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="normal">dashboard text, mirrors,</text>
<text x="170" y="624" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="normal">DNA selector</text>
<rect x="380" y="180" width="170" height="400" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="465" y="215" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold">SGW bypass</text>
<text x="465" y="238" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="normal">cable</text>
<text x="465" y="270" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">gives a free</text>
<text x="465" y="288" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">OBD port with</text>
<text x="465" y="306" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">all 3 networks</text>
<text x="465" y="324" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">+ 12 V + ground</text>
<rect x="410" y="470" width="110" height="70" rx="8" fill="#fff" stroke="#334155" stroke-width="2"/>
<text x="465" y="500" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">OBD port</text>
<text x="465" y="522" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">(female)</text>
<polyline points="310,210 345,210 345,380 380,380" fill="none" stroke="#d97706" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="310,400 345,400 345,410 380,410" fill="none" stroke="#0891b2" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="310,590 345,590 345,440 380,440" fill="none" stroke="#16a34a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="620" y="110" width="840" height="660" rx="16" fill="#fbfdff" stroke="#334155" stroke-width="3"/>
<text x="1040" y="145" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="bold">OUR BOX = the DIY BACCAble</text>
<rect x="560" y="470" width="80" height="70" rx="8" fill="#fff" stroke="#334155" stroke-width="2"/>
<text x="600" y="500" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">OBD</text>
<text x="600" y="520" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">plug</text>
<polyline points="520,505 560,505" fill="none" stroke="#334155" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="760" y="180" width="380" height="150" rx="12" fill="#fff" stroke="#d97706" stroke-width="3"/>
<text x="790" y="218" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#d97706" text-anchor="start" font-weight="bold">C1</text>
<text x="850" y="216" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#111827" text-anchor="start" font-weight="bold">UCAN board — the BOSS</text>
<text x="790" y="252" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#111827" text-anchor="start" font-weight="normal">reads buttons, shows the menu,</text>
<text x="790" y="274" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#111827" text-anchor="start" font-weight="normal">decides, sends orders,</text>
<text x="790" y="296" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#111827" text-anchor="start" font-weight="normal">puts C2 + BH to sleep</text>
<polyline points="640,505 700,505 700,255 760,255" fill="none" stroke="#d97706" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="760" y="370" width="380" height="150" rx="12" fill="#fff" stroke="#0891b2" stroke-width="3"/>
<text x="790" y="408" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#0891b2" text-anchor="start" font-weight="bold">C2</text>
<text x="850" y="406" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#111827" text-anchor="start" font-weight="bold">UCAN board — helper</text>
<text x="790" y="442" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#111827" text-anchor="start" font-weight="normal">ESC/TC, DYNO, brake override,</text>
<text x="790" y="464" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#111827" text-anchor="start" font-weight="normal">park mute, ABS faults</text>
<polyline points="640,505 700,505 700,445 760,445" fill="none" stroke="#0891b2" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="760" y="560" width="380" height="150" rx="12" fill="#fff" stroke="#16a34a" stroke-width="3"/>
<text x="790" y="598" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#16a34a" text-anchor="start" font-weight="bold">BH</text>
<text x="850" y="596" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#111827" text-anchor="start" font-weight="bold">UCAN board — helper</text>
<text x="790" y="632" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#111827" text-anchor="start" font-weight="normal">writes text on the cluster,</text>
<text x="790" y="654" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#111827" text-anchor="start" font-weight="normal">odometer blink, mirrors</text>
<polyline points="640,505 700,505 700,635 760,635" fill="none" stroke="#16a34a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="1165,230 1165,640" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="1140,230 1165,230" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="1165" cy="230" r="5" fill="#2563eb"/>
<polyline points="1140,445 1165,445" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="1165" cy="445" r="5" fill="#2563eb"/>
<polyline points="1140,640 1165,640" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="1165" cy="640" r="5" fill="#2563eb"/>
<text x="1180" y="335" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#2563eb" text-anchor="start" font-weight="bold">serial wire</text>
<text x="1180" y="355" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="start" font-weight="normal">C1 ↔ C2 ↔ BH</text>
<text x="1180" y="373" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="start" font-weight="normal">(orders + answers)</text>
<polyline points="1140,290 1400,290 1400,680 1140,680" fill="none" stroke="#ea580c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10,6"/>
<polyline points="1400,480 1140,480" fill="none" stroke="#ea580c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10,6"/>
<text x="1180" y="560" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#ea580c" text-anchor="start" font-weight="bold">2 sleep wires</text>
<text x="1180" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#ea580c" text-anchor="start" font-weight="normal">C1 → C2 + BH</text>
<text x="1180" y="598" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#ea580c" text-anchor="start" font-weight="normal">(car parked → sleep)</text>
<rect x="1290" y="170" width="150" height="110" rx="10" fill="#fff7ed" stroke="#334155" stroke-width="2"/>
<text x="1365" y="200" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#111827" text-anchor="middle" font-weight="bold">Power</text>
<text x="1365" y="222" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">OBD 16 (12 V)</text>
<text x="1365" y="240" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">→ fuse → 3.3 V</text>
<text x="1365" y="258" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">→ all 3 boards</text>
<text x="660" y="755" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="start" font-weight="normal">Each board also has its own USB-C port: for loading firmware, the ELM327 diagnostic mode and the sniffer.</text>
</svg>
