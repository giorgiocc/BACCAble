<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="42" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" fill="#111827" text-anchor="start" font-weight="bold">How the three boards work together — two real examples from the code</text>
<text x="30" y="92" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#111827" text-anchor="start" font-weight="bold">Example 1 — you open the BACCAble menu and read it on the cluster</text>
<rect x="30" y="106" width="1440" height="48" rx="6" fill="#f8fafc"/>
<text x="44" y="135" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#d97706" text-anchor="start" font-weight="bold">C1 network</text>
<rect x="30" y="176" width="1440" height="48" rx="6" fill="#f8fafc"/>
<text x="44" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#d97706" text-anchor="start" font-weight="bold">C1 board</text>
<rect x="30" y="246" width="1440" height="48" rx="6" fill="#f8fafc"/>
<text x="44" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold">serial wire</text>
<rect x="30" y="316" width="1440" height="48" rx="6" fill="#f8fafc"/>
<text x="44" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#16a34a" text-anchor="start" font-weight="bold">C2 / BH board</text>
<rect x="30" y="386" width="1440" height="48" rx="6" fill="#f8fafc"/>
<text x="44" y="415" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#16a34a" text-anchor="start" font-weight="bold">C2 / BH network</text>
<circle cx="200" cy="130" r="15" fill="#d97706"/>
<text x="200" y="135" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<text x="222" y="127" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">you hold RES ≈ 2 s:</text>
<text x="222" y="144" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">steering wheel sends 0x2FA</text>
<circle cx="440" cy="200" r="15" fill="#d97706"/>
<text x="440" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<text x="462" y="197" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">C1 sees the button,</text>
<text x="462" y="214" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">builds the menu text</text>
<polyline points="215,140 428,190" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="428,190 415.31172593692116,192.829788207658 417.896193110635,181.81995804763687" fill="#94a3b8"/>
<circle cx="690" cy="270" r="15" fill="#2563eb"/>
<text x="690" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<text x="712" y="267" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">C1 sends the text to BH</text>
<text x="712" y="284" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">(serial message 0x03)</text>
<polyline points="455,210 678,260" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="678,260 665.3406573615933,262.956525657494 667.8149003176934,251.9214020732878" fill="#94a3b8"/>
<circle cx="940" cy="340" r="15" fill="#16a34a"/>
<text x="940" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
<text x="962" y="337" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">BH receives it</text>
<text x="962" y="354" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal"></text>
<polyline points="705,280 928,330" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="928,330 915.3406573615933,332.956525657494 917.8149003176934,321.92140207328777" fill="#94a3b8"/>
<circle cx="1190" cy="410" r="15" fill="#16a34a"/>
<text x="1190" y="415" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">5</text>
<text x="1212" y="407" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">BH sends the text to the</text>
<text x="1212" y="424" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">cluster as 0x090 frames</text>
<polyline points="955,350 1178,400" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="1178,400 1165.3406573615935,402.956525657494 1167.8149003176934,391.92140207328777" fill="#94a3b8"/>
<text x="30" y="482" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#111827" text-anchor="start" font-weight="bold">Example 2 — you switch ESC/TC in the menu</text>
<rect x="30" y="506" width="1440" height="48" rx="6" fill="#f8fafc"/>
<text x="44" y="535" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#d97706" text-anchor="start" font-weight="bold">C1 network</text>
<rect x="30" y="576" width="1440" height="48" rx="6" fill="#f8fafc"/>
<text x="44" y="605" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#d97706" text-anchor="start" font-weight="bold">C1 board</text>
<rect x="30" y="646" width="1440" height="48" rx="6" fill="#f8fafc"/>
<text x="44" y="675" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="start" font-weight="bold">serial wire</text>
<rect x="30" y="716" width="1440" height="48" rx="6" fill="#f8fafc"/>
<text x="44" y="745" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#16a34a" text-anchor="start" font-weight="bold">C2 / BH board</text>
<rect x="30" y="786" width="1440" height="48" rx="6" fill="#f8fafc"/>
<text x="44" y="815" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#16a34a" text-anchor="start" font-weight="bold">C2 / BH network</text>
<circle cx="200" cy="530" r="15" fill="#d97706"/>
<text x="200" y="535" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<text x="222" y="527" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">you select ESC/TC:</text>
<text x="222" y="544" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">button frame 0x2FA</text>
<circle cx="440" cy="600" r="15" fill="#d97706"/>
<text x="440" y="605" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<text x="462" y="597" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">C1 handles the menu</text>
<text x="462" y="614" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">choice</text>
<polyline points="215,540 428,590" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="428,590 415.31172593692116,592.829788207658 417.896193110635,581.8199580476369" fill="#94a3b8"/>
<circle cx="690" cy="670" r="15" fill="#2563eb"/>
<text x="690" y="675" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<text x="712" y="667" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">C1 orders C2:</text>
<text x="712" y="684" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">"toggle ESC/TC"</text>
<polyline points="455,610 678,660" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="678,660 665.3406573615933,662.956525657494 667.8149003176934,651.9214020732878" fill="#94a3b8"/>
<circle cx="940" cy="740" r="15" fill="#16a34a"/>
<text x="940" y="745" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
<text x="962" y="737" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">C2 receives the order</text>
<text x="962" y="754" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal"></text>
<polyline points="705,680 928,730" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="928,730 915.3406573615933,732.956525657494 917.8149003176934,721.9214020732878" fill="#94a3b8"/>
<circle cx="1190" cy="810" r="15" fill="#16a34a"/>
<text x="1190" y="815" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">5</text>
<text x="1212" y="807" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">C2 sends its messages</text>
<text x="1212" y="824" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">on the C2 network</text>
<polyline points="955,750 1178,800" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="1178,800 1165.3406573615935,802.956525657494 1167.8149003176934,791.9214020732878" fill="#94a3b8"/>
<text x="30" y="885" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="start" font-weight="normal">Only C1 starts a conversation on the serial wire; C2 and BH only answer. Without C2 there is no ESC/TC; without BH no text on the cluster.</text>
</svg>
