<text x="935" y="385" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#111827" text-anchor="start" font-weight="normal">and each board's P1 GND (CAN cable)</text>
<text x="30" y="418" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#dc2626" text-anchor="start" font-weight="bold">Rule: never plug USB into a board while its 3.3 V plug is connected — unplug the plug first (no diode on a UCAN).</text>
